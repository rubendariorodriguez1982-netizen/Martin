<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>STRADATA Onboarding KYC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:wght@400;600;700;800&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Identidad STRADATA AML Suite (tomada de la suite: Montserrat, verde #4DA833, grises #808080/#686968, fondo blanco).
   Layout: barra superior blanca con logo + navegación lateral clara; portal del tercero en columna centrada con encabezado de marca. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F8F9FA; --line:#DEE2E6; --line-2:#EEF0F3;
  --ink:#333333; --ink-2:#464646; --muted:#686968; --faint:#9D9F9C;
  --side:#FFFFFF; --side-ink:#4A4B4A; --side-hi:#1F201F; --side-line:#E9EBE9;
  --brand-green:#4DA833; --brand-grey:#808080; --brand-dark:#3A3A3A;
  --accent:#3DAE2B; --accent-2:#35A023; --accent-soft:#EAF6E7; --accent-ink:#FFFFFF;
  --navy:#042475; --title:#5773A4; --teal:#00CCC2; --teal-2:#00B3AA; --teal-soft:#E0F8F6; --suite-soft:#EDF5FF; --foot-ink:#667B81; --inp-line:#CCCCCC;
  --ok:#2E8540; --ok-soft:#E5F3E8; --warn:#B07311; --warn-soft:#FCF1DD; --crit:#C73A3A; --crit-soft:#FBE6E6;
  --info:#2F6FB0; --info-soft:#E5EEF8; --violet:#6A55B8; --violet-soft:#EEEBFA;
  --portal-bg:#F5F7FA; --portal-head:#FFFFFF; --ph-ink:#262726; --ph-muted:#686968;
  --f-display:"Nunito Sans","Montserrat",Roboto,Arial,sans-serif;
  --f-body:"Nunito Sans","Montserrat",Roboto,Arial,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:5px; --r-lg:8px;
  --shadow:0 1px 2px rgba(20,22,20,.06),0 4px 14px rgba(20,22,20,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111312; --panel:#1A1C1B; --panel-2:#151716; --line:#2C302D; --line-2:#232624;
  --ink:#E7E9E7; --ink-2:#C9CCC9; --muted:#9A9E9A; --faint:#737773;
  --side:#161817; --side-ink:#A9AEA9; --side-hi:#FFFFFF; --side-line:#232624;
  --brand-grey:#A3A3A3; --brand-dark:#1A1A1A;
  --accent:#4CC23A; --accent-2:#5FCC4E; --accent-soft:#1A2F16; --accent-ink:#08170A;
  --navy:#A9BDF5; --title:#93ABD8; --teal:#2FDCD2; --teal-2:#22C7BE; --teal-soft:#0F2E2C; --suite-soft:#16213A; --foot-ink:#8FA3A9; --inp-line:#3A3F44;
  --ok:#5CC274; --ok-soft:#14281A; --warn:#E3AA4E; --warn-soft:#2E230E; --crit:#F07C7C; --crit-soft:#341616;
  --info:#7FAEE6; --info-soft:#15212F; --violet:#A796F0; --violet-soft:#1E1A36;
  --portal-bg:#111312; --portal-head:#1A1C1B; --ph-ink:#E7E9E7; --ph-muted:#9A9E9A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111312; --panel:#1A1C1B; --panel-2:#151716; --line:#2C302D; --line-2:#232624;
  --ink:#E7E9E7; --ink-2:#C9CCC9; --muted:#9A9E9A; --faint:#737773;
  --side:#161817; --side-ink:#A9AEA9; --side-hi:#FFFFFF; --side-line:#232624;
  --brand-grey:#A3A3A3; --brand-dark:#1A1A1A;
  --accent:#4CC23A; --accent-2:#5FCC4E; --accent-soft:#1A2F16; --accent-ink:#08170A;
  --navy:#A9BDF5; --title:#93ABD8; --teal:#2FDCD2; --teal-2:#22C7BE; --teal-soft:#0F2E2C; --suite-soft:#16213A; --foot-ink:#8FA3A9; --inp-line:#3A3F44;
  --ok:#5CC274; --ok-soft:#14281A; --warn:#E3AA4E; --warn-soft:#2E230E; --crit:#F07C7C; --crit-soft:#341616;
  --info:#7FAEE6; --info-soft:#15212F; --violet:#A796F0; --violet-soft:#1E1A36;
  --portal-bg:#111312; --portal-head:#1A1C1B; --ph-ink:#E7E9E7; --ph-muted:#9A9E9A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:21px;font-weight:600;color:var(--ink-2)} h2{font-size:17px;font-weight:600} h3{font-size:14.5px;font-weight:600} h4{font-size:13px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.sep{height:1px;background:var(--line-2);margin:4px 0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:4.8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--panel-2);border-color:var(--line-2)}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px}
.btn-lg{height:46px;padding:0 20px;font-size:15px;border-radius:9px}
.btn-block{width:100%}
.ico{width:15px;height:15px;flex:none}

/* Píldoras y etiquetas */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.p-neutral{color:var(--muted)}
.p-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.p-crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.p-accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.p-violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.p-strike{text-decoration:line-through}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.t-ocr{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 35%,transparent);background:var(--violet-soft)}
.t-dec{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent);background:var(--info-soft)}
.t-con{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.t-val{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:var(--ok-soft)}
.t-cor{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft)}
.t-sim{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:transparent;border-style:dashed}
.t-real{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:transparent}

/* Paneles */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-pad{padding:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-body{padding:16px}
.note{padding:10px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.note-warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note-crit{background:var(--crit-soft);border-color:transparent;color:var(--ink)}
.note-info{background:var(--info-soft);border-color:transparent;color:var(--ink)}
.note-ok{background:var(--ok-soft);border-color:transparent;color:var(--ink)}

/* Campos */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req::after{content:"*";color:var(--crit);margin-left:2px}
.inp,select.inp,textarea.inp{height:36px;border:1px solid #CED4DA;border-radius:4px;background:var(--panel);color:var(--ink);padding:0 10px;font:inherit;font-size:14px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.inp.invalid{border-color:var(--crit)}
.inp.lowconf{border-color:var(--warn);background:color-mix(in srgb,var(--warn-soft) 60%,var(--panel))}
.hint{font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ====== AMBIENTE STRADATA ====== */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;gap:18px;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 6px 14px;border-bottom:1px solid var(--side-line)}
.logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none}
.logo svg{flex:none;display:block}
.logo-txt{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;line-height:1;white-space:nowrap;color:var(--brand-grey)}
.logo-txt b{font-weight:600;color:var(--brand-grey)} .logo-txt i{font-style:normal;font-weight:700;color:var(--brand-green)}
.brand-sub{font-size:11px;color:var(--side-ink);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;border:0;background:transparent;color:var(--side-ink);font-size:13.5px;cursor:pointer}
.nav button:hover{background:var(--side-line);color:var(--side-hi)}
.nav button.on{background:var(--accent-soft);color:var(--side-hi);font-weight:600;box-shadow:inset 3px 0 0 var(--brand-green)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);opacity:.75}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:11.5px;padding:0 6px}
.side-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--side-line);border-radius:8px;font-size:11.5px;line-height:1.35}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.dot.ok{background:#3DBE76} .dot.warn{background:#E3A84A}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
body.sim-open .main{padding-right:max(436px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumbs button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
@media (max-width:900px){
  .brand{border-bottom:0;padding-bottom:0}
  .admin{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;gap:10px;padding-block:10px;padding-right:max(12px,env(safe-area-inset-right,0px));overflow-x:auto}
  .brand-sub,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:7px 10px}
  .nav .count{display:none}
  body.sim-open .main{padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k-lbl{font-size:11.5px;color:var(--muted);line-height:1.3}
.kpi .k-val{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-sub{font-size:11px;color:var(--faint)}
.kpi.k-alert .k-val{color:var(--crit)}

/* Escenarios */
.scen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.scen{grid-template-columns:minmax(0,1fr)}}
.scen-card{padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);display:flex;flex-direction:column;gap:10px;min-width:0}
.scen-letter{font-family:var(--f-display);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:var(--panel);flex:none}
.scen ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}

/* Flujo de 7 etapas */
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.flow-step{padding:10px 10px 12px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.flow-step:last-child{border-right:0}
.flow-step .n{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.flow-step .t{font-size:12px;font-weight:600;line-height:1.25}
.flow-step .s{font-size:11px;color:var(--muted);line-height:1.3}
.flow-step::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line-2)}
.flow-step.done::after{background:var(--accent)}
.flow-step.cur::after{background:linear-gradient(90deg,var(--accent) 50%,var(--line-2) 50%)}
.flow-step.done .n,.flow-step.cur .n{color:var(--accent)}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow-step{border-bottom:1px solid var(--line-2)}}

/* Pestañas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .badge{font-size:10.5px;font-family:var(--f-mono);background:var(--crit-soft);color:var(--crit);border-radius:9px;padding:0 6px}

/* Controles de validación */
.ctrl{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:10px 12px 10px 0;border-bottom:1px solid var(--line-2);align-items:start}
.ctrl:last-child{border-bottom:0}
.ctrl .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line)}
.ctrl.ok .bar{background:var(--ok)} .ctrl.alerta .bar{background:var(--warn)} .ctrl.error .bar{background:var(--crit)} .ctrl.info .bar{background:var(--info)}
.ctrl .ttl{font-weight:600;font-size:13px}
.ctrl .dt{font-size:12.5px;color:var(--muted)}
.ctrl .rid{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:6px}

/* OCR */
.ocr{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.ocr{grid-template-columns:minmax(0,1fr)}}
.ocr-prev{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-2);aspect-ratio:auto;max-width:100%}
.ocr-prev img{display:block;width:100%;height:auto}
.conf{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.conf i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;position:relative}
.conf i b{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.conf.mid i b{background:var(--warn)} .conf.low i b{background:var(--crit)}

/* Línea de tiempo */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-item{display:grid;grid-template-columns:110px 14px minmax(0,1fr);gap:10px;padding:7px 0}
.tl-time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--faint);box-shadow:0 0 0 3px var(--panel)}
.tl-dot.analista{background:var(--info)} .tl-dot.tercero{background:var(--violet)} .tl-dot.sistema{background:var(--accent)} .tl-dot.case_manager{background:var(--ok)}
.tl-ev{font-size:13px} .tl-ev .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
@media (max-width:560px){.tl-item{grid-template-columns:minmax(0,1fr)}.tl-time{text-align:left}.tl-dot{display:none}}

/* Riesgo */
.risk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.risk .score{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.risk.Bajo .score{color:var(--ok)} .risk.Medio .score{color:var(--warn)} .risk.Alto .score{color:var(--crit)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;position:relative;flex:1;min-width:80px}
.meter b{position:absolute;inset:0 auto 0 0;border-radius:3px}

/* Modal y toasts */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,20,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-width:100%}
.modal.wide{width:min(1000px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);pointer-events:auto;max-width:100%}
.toast.err{background:var(--crit);color:#fff}

/* Correo de invitación */
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#F4F6F8}
.mail-meta{padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line-2);font-size:12.5px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:3px 8px}
.wa{background:#E7DED4;border-radius:10px;padding:16px;display:flex;justify-content:flex-end}
.wa-bubble{background:#D9FDD3;color:#111B21;border-radius:10px 2px 10px 10px;padding:9px 11px;max-width:92%;font-size:13.5px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.linkbox{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);min-width:0}
.linkbox code{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;flex:1;min-width:0}
.qr{width:132px;height:132px;padding:6px;background:#fff;border-radius:8px;border:1px solid var(--line);flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important}

/* Simulador móvil */
.sim{position:fixed;top:0;right:0;bottom:0;width:420px;z-index:60;background:var(--panel-2);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-left:12px;gap:10px}
.sim-head{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;flex-wrap:wrap}
.sim-head .btn-sm{padding:0 8px}
.sim-head .row{flex-wrap:nowrap}
.sim-head b{white-space:nowrap}
.sim:not(.desk) .sim-head .tiny{display:none}
.seg button{display:inline-flex;align-items:center;gap:5px}
.btn-lg{height:auto;min-height:46px;white-space:normal;text-align:center;padding-block:10px}
.phone{flex:1;min-height:0;border-radius:34px;border:10px solid #0B1118;background:var(--portal-bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative}
.phone-bar{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:600;background:#0B1118;color:#fff;flex:none}
.phone-url{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phone-screen{flex:1;min-height:0;overflow-y:auto}
@media (max-width:900px){.sim{width:100%;left:0;border-left:0;padding-left:max(12px,env(safe-area-inset-left,0px))}.phone{border-width:6px;border-radius:22px}}

/* Vista de navegador de escritorio (presentación) */
.sim.desk{left:0;width:100%;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sim.desk .sim-head{max-width:1280px;width:100%;margin:0 auto}
.browser{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.18);background:var(--portal-bg)}
.browser-top{display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;background:#DEE3E9;color:#2B3B4F;flex:none}
.browser-top .dots{display:flex;gap:6px}.browser-top .dots i{width:11px;height:11px;border-radius:50%;background:#C4CBD4;display:block}
.browser-top .btab{display:flex;align-items:center;gap:6px;height:30px;margin-top:8px;padding:0 14px;border-radius:8px 8px 0 0;background:#F6F8FA;font-size:12px}
.browser-url{display:flex;align-items:center;gap:2px;height:36px;padding:0 14px;background:#F6F8FA;border-bottom:1px solid #D5DBE2;font-size:13px;color:#2B3B4F;flex:none;overflow:hidden;white-space:nowrap}
.browser-url .ico{color:#1E8048;margin-right:6px}.browser-url .b-https{color:#7A8796}.browser-url .b-host{color:#0F1C2B;font-weight:600}.browser-url .b-path{color:#5D6D80;overflow:hidden;text-overflow:ellipsis}

/* ====== PORTAL DEL TERCERO ====== */
.portal{min-height:100%;background:var(--portal-bg);display:flex;flex-direction:column}
.p-head{background:var(--portal-head);color:var(--ph-ink);border-bottom:3px solid var(--brand-green);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-head-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.p-org{font-size:11.5px;color:var(--ph-muted);text-align:right;line-height:1.3}
.p-org b{color:var(--ph-ink);font-weight:600;display:block;font-size:12.5px}
.p-prog{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:5}
.p-prog-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.p-bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.p-bar b{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.p-body{flex:1;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-body-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.p-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.p-title{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.25}
.p-lead{font-size:14.5px;color:var(--ink-2)}
.p-nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.p-foot{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;font-size:11.5px;color:var(--faint)}
.portal .inp{height:44px;font-size:15px}
.portal textarea.inp{height:auto}
.portal .field label{font-size:13px}
.choice{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:420px){.choice{grid-template-columns:minmax(0,1fr)}}
.choice button{text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.choice button.on{border-color:var(--accent);background:var(--accent-soft)}
.choice button[disabled]{opacity:.5;cursor:not-allowed}
.choice .c-t{font-family:var(--f-display);font-weight:600;font-size:15px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.drop.has{border-style:solid;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.drop.dragover{border-color:var(--accent);background:var(--accent-soft)}
.drop-row{display:flex;gap:12px;align-items:flex-start}
.drop-ico{width:38px;height:38px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.ocr-steps{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.ocr-steps div{display:flex;gap:8px;align-items:center;color:var(--faint)}
.ocr-steps div.on{color:var(--ink)}
.ocr-steps div.done{color:var(--ok)}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.inp.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}100%{}}
.drop.scan{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent-soft) 45%,var(--panel))}
.live-fields{border-top:1px dashed var(--line);padding-top:8px}
.live-row{animation:liveIn .35s ease-out}
@keyframes liveIn{from{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.p-bar b{transition:none}.inp.flash,.live-row{animation:none}}
.srcline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.yn button{border:0;background:var(--panel);padding:8px 14px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.yn button.on-si{background:var(--warn);color:#fff}
.yn button.on-no{background:var(--accent);color:var(--accent-ink)}
.pep-q{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line-2)}
.pep-q:last-child{border-bottom:0}
.sig{border:1.5px solid var(--line);border-radius:10px;background:#FFFFFF;position:relative;touch-action:none;height:170px}
.sig canvas{width:100%;height:100%;display:block;border-radius:10px;cursor:crosshair}
.sig-line{position:absolute;left:20px;right:20px;bottom:38px;border-top:1px dashed #9AA8B8;pointer-events:none}
.sig-ph{position:absolute;left:20px;bottom:16px;font-size:11px;color:#8090A3;pointer-events:none}
.pdfview{border:1px solid var(--line);border-radius:10px;background:#5B6675;max-height:460px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pdfview canvas{max-width:100%;height:auto!important;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.inbox{border:1px dashed color-mix(in srgb,var(--warn) 60%,var(--line));border-radius:10px;padding:10px 12px;background:var(--warn-soft);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.otp{font-family:var(--f-mono);font-size:22px;letter-spacing:.35em;text-align:center}
.big-ok{width:58px;height:58px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.ev{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.ev dt{color:var(--muted)} .ev dd{margin:0;overflow-wrap:anywhere}
@media (max-width:480px){.ev{grid-template-columns:minmax(0,1fr)}.ev dd{margin-bottom:6px}}

/* Árbol de propiedad */
.tree-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:8px}
.tree-wrap svg{display:block}
.sh-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.sh-row.child{margin-left:22px;border-style:dashed}

/* Case Manager */
.cm-shell{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.cm-top{background:var(--panel);border-bottom:3px solid var(--brand-green);color:var(--ink);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cm-grid{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:420px}
@media (max-width:860px){.cm-grid{grid-template-columns:minmax(0,1fr)}}
.cm-list{border-right:1px solid var(--line-2);display:flex;flex-direction:column}
.cm-item{padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:4px;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.cm-item.on{background:var(--accent-soft)}
.apilog{font-family:var(--f-mono);font-size:11.5px;background:#0B1520;color:#C6D6E6;border-radius:10px;padding:12px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.apilog .m{color:#7FD3DE} .apilog .s2{color:#78D69B} .apilog .s4{color:#F2A08F} .apilog .c{color:#6F8296}
pre.code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:520px;margin:0;white-space:pre}
.doc-sec{display:flex;flex-direction:column;gap:10px;max-width:880px}
.doc-sec p,.doc-sec li{font-size:14px;color:var(--ink-2);line-height:1.6}
.doc-sec ul,.doc-sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px}
.empty{padding:36px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.inline-sim{display:inline-flex;align-items:center;gap:4px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font-weight:600}
.guide{border:1px solid color-mix(in srgb,var(--violet) 35%,var(--line));background:var(--violet-soft);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}

/* ====== Shell de la suite STRADATA (réplica de Search / Case Manager: Nunito Sans, navy #042475, verde #3DAE2B) ====== */
body{color:var(--ink-2)}
h1{font-size:21px;font-weight:700;color:var(--title)}
h2{color:var(--navy);font-weight:700} h3{font-weight:700;color:var(--ink)}
.admin{display:flex;flex-direction:column;min-height:100vh}
.suite-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:60px;flex:none;background:var(--panel);border-bottom:1px solid var(--line-2);box-shadow:0 2px 6px rgba(4,36,117,.06);display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--panel)}
.st-prod{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0;min-width:0}
.st-name{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.st-name b{font-weight:800;font-size:17px;color:var(--navy);white-space:nowrap}
.st-name small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.st-apps{display:flex;gap:24px;margin-left:28px}
.st-apps button{border:0;background:none;color:#686968;font-weight:700;font-size:14px;cursor:pointer;padding:19px 0 17px;white-space:nowrap;border-bottom:3px solid transparent}
.st-apps button:hover{color:var(--navy)}
.st-apps button.on{color:var(--navy);border-bottom-color:var(--accent)}
.st-right{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.st-ico{width:32px;height:32px;display:grid;place-items:center;border:0;background:none;color:var(--navy);cursor:pointer;border-radius:6px;position:relative}
.st-ico:hover{background:var(--suite-soft)}
.st-ico .ico{width:17px;height:17px}
.st-badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:#E03B3B;color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.st-salir{border:0;background:none;color:#686968;font-weight:700;cursor:pointer;font-size:14px;padding:0 4px}
.st-av{width:37px;height:37px;border-radius:35px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px;flex:none}
.st-menu{position:absolute;top:46px;right:0;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(4,36,117,.16);padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:50}
.st-menu button{border:0;background:none;border-radius:6px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--navy);cursor:pointer}
.st-menu button:hover,.st-menu button.on{background:var(--suite-soft)}
.st-menu .app-ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.suite-body{flex:1;display:grid;grid-template-columns:249px minmax(0,1fr);min-height:0}
.admin.side-off .suite-body{grid-template-columns:62px minmax(0,1fr)}
.side{background:var(--panel);color:var(--navy);border-right:1px solid var(--line-2);top:calc(60px + env(safe-area-inset-top,0px));height:calc(100vh - 60px);gap:4px;padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;overflow-y:auto}
.nav{gap:1px}
.nav button{height:36px;padding:0 12px;border-radius:5px;color:var(--navy);font-size:12.6px;font-weight:600;gap:12px}
.nav button .ico{color:var(--accent);width:16px;height:16px;flex:none}
.nav button:hover{background:var(--suite-soft);color:var(--navy)}
.nav button.on{background:var(--suite-soft);color:var(--navy);font-weight:800;box-shadow:none}
.nav .count{font-family:var(--f-body);font-weight:800;font-size:11px;background:var(--accent);color:#fff;border-radius:3.5px;padding:0 6px;line-height:17px;opacity:1}
.nav-sec{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 12px 4px}
.side-toggle{border:0;background:none;color:var(--navy);font-size:11.2px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 12px;margin-top:6px}
.side-toggle .ico{width:14px;height:14px;color:var(--accent)}
.side-foot{margin-top:auto;padding:0}
.side-chip{border-color:var(--line-2);border-radius:5px;color:var(--muted)}
.admin.side-off .nav button>span,.admin.side-off .nav-sec,.admin.side-off .side-foot,.admin.side-off .side-toggle span{display:none}
.admin.side-off .nav button{justify-content:center;padding:0}
.admin.side-off .side-toggle .ico{transform:rotate(180deg)}
.main{display:flex;flex-direction:column;padding-block:22px 40px}
.main-inner{width:100%}
.suite-foot{flex:none;min-height:49px;background:var(--suite-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--foot-ink);font-weight:700;font-size:12.6px}
.suite-foot a,.suite-foot button{color:var(--foot-ink);font-weight:700;border:0;background:none;cursor:pointer;font-size:12.6px;padding:0}
.eyebrow{color:var(--foot-ink);font-weight:700}
.crumbs button{color:var(--navy);font-weight:700}
/* Componentes con la gramática de la suite */
.btn{border-radius:4px;font-weight:600;height:34px}
.btn:not(.btn-danger):not(.btn-ghost){border-color:var(--accent)}
.btn:not(.btn-primary):not(.btn-danger):not(.btn-ghost){color:var(--ink)}

<script>

const pill = e => `<span class="pill ${ESTADO_CLASE[e] || ''}">${esc(e)}</span>`;

async function crearSolicitud(borrador) {
  const n = S.nueva; const err = [];
  if (n.canal !== 'whatsapp' && !/^\S+@\S+\.\S+$/.test(n.email)) err.push('un correo válido');
  if (n.canal !== 'email' && soloDig(n.celular).length < 10) err.push('un celular de 10 dígitos');
  if (n.otp && soloDig(n.celular).length < 10) err.push('un celular para el OTP');
  if (!n.fechaLimite || n.fechaLimite < hoyCO()) err.push('una fecha límite futura');
  if (!borrador && !n.motivo.trim()) err.push('el motivo');
  if (err.length && !borrador) { $('#nueva-err').innerHTML = `<div class="note note-crit">Para crear la solicitud falta ${err.join(', ')}.</div>`; return; }
  const req = nuevaSolicitud(Object.assign({}, n, {borrador}));
  if (n.escenario) { req.demo = true; req.escenario = n.escenario; }
  Store.creadasSesion.add(req.id); await Store.save(req); S.nueva = null; toast(borrador ? 'Borrador guardado' : 'Solicitud creada y enlace generado');

}

function arbolSVG(r) {

function tareasCM(r) {
  const T = []; const add = (t, p, regla) => { if (!T.some(x => x.t === t)) T.push({id: 't' + (T.length + 1), t, p, regla, hecha: false}); };
  alertasDe(r).forEach(c => {
    if (c.id === 'E05') add(`Escalar coincidencia en lista restrictiva (${c.detalle.split(':')[0]}) al Oficial de Cumplimiento`, 'Crítica', c.id);
    else if (c.id === 'E04' || c.id === 'V50' || c.id === 'V51') add('Aplicar debida diligencia intensificada por vínculo PEP', 'Alta', c.id);
    else if (c.id === 'V02') add('Confirmar identificación con el tercero y corregir el registro inicial', 'Alta', c.id);
    else if (c.id === 'V16') add('Solicitar certificado de Cámara de Comercio actualizado', 'Media', c.id);

    else if (c.id === 'V30' || c.id === 'V30b') add('Completar la composición accionaria faltante', 'Alta', c.id);
    else if (c.id === 'V40') add('Solicitar soporte documental del origen del patrimonio', 'Media', c.id);
    else if (c.id === 'V05') add('Verificar datos OCR de baja confianza contra el documento original', 'Baja', c.id);
    else add(`Revisar: ${c.nombre}`, c.sev === 'alta' ? 'Alta' : 'Media', c.id);
  });
  add('Revisión final del expediente y concepto del analista', 'Media', '—');
  return T;
}

<script>

function preq() { return P.firmaMode ? Store.byFirmaToken(P.token) : Store.byToken(P.token); }

    ev(req, 'sistema', 'Expediente recibido por STRADATA', `${req.documentos.length} documento(s) + PDF firmado · ${req.validacion.resumen.errores} error(es), ${req.validacion.resumen.alertas} alerta(s) · riesgo ${req.validacion.riesgo.nivel}`);
    req.portal.paso = 'fin'; if (!req.portal.visitados.includes('fin')) req.portal.visitados.push('fin');
    P.otpFirma = null; P.firmante = null; P.recienFirmado = req.id; await Store.save(req); renderPortal();
    if (APP.cm.autoCrear) setTimeout(() => transferirCM(req.id, {auto: true}).then(() => { if (P.root && document.body.contains(P.root)) renderPortal(); }).catch(e => console.warn('Case Manager', e)), 300);
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = 'Firmar y enviar'; box.innerHTML = `<div class="note note-crit small">No fue posible completar la firma: ${esc(e.message || e)}</div>`; }
}

/* ---------- Firma adicional ---------- */
function renderFirmaAdicional({req, firma: fa}) {
  const root = P.root;
  if (!req.firma || req.firma.ejemplo) { root.innerHTML = pMensaje(req, 'Documento aún no disponible', 'El documento principal todavía no ha sido firmado por el titular.', 'note-warn'); return; }
  if (fa.estado === 'Firmada') { root.innerHTML = pShell(req, `<div class="p-card" style="align-items:center;text-align:center"><div class="big-ok">${ICON.check.replace('class="ico"', 'width="30" height="30"')}</div><div class="p-title">Firma registrada</div><p class="p-lead">${esc(fa.nombre)}, tu firma quedó incorporada al expediente ${esc(req.id)} el ${fmtFH(fa.firmadoAt)}.</p><span class="mono small">${esc(fa.evidenciaId)}</span></div>`); return; }
  const o = P.otpFirma;
  root.innerHTML = pShell(req, `<div class="p-card"><span class="eyebrow">Firma adicional · ${esc(req.id)}</span><div class="p-title">${esc(fa.nombre)}, se requiere tu firma</div><p class="p-lead">Firmas como <b>${esc(fa.calidad)}</b> el formulario de vinculación de ${esc(nombreTercero(req))}.</p>
   <div class="pdfview" id="p-pdf" style="max-height:360px"></div>
   <label class="chk"><input type="checkbox" id="fa-acepto"><span>Revisé el documento y acepto su contenido y las declaraciones que contiene.</span></label>
   <div class="field"><label for="fa-idc">Confirma tu número de identificación</label><input class="inp" id="fa-idc" inputmode="numeric"></div>
   <div class="stack-sm"><div class="row-between"><span class="lbl">Firma en pantalla</span><button class="btn btn-sm btn-ghost" data-a="p-firma-limpiar">Limpiar</button></div><div class="sig" id="sig"><canvas></canvas><div class="sig-line"></div><div class="sig-ph">Firma aquí</div></div></div>
   <div class="stack-sm" id="otp-box" data-cel="${esc(fa.celular)}" data-lbl="Código al celular ${esc(maskTel(fa.celular))}"><span class="lbl">Código al celular ${esc(maskTel(fa.celular))}</span>${o && o.verificadoAt ? `<div class="note note-ok small">Código verificado.</div>` : o ? `<div class="inbox"><b>Mensaje SMS simulado · solo demostración</b><span>Código de firma: <b class="mono">${o.codigo}</b></span></div><div class="row" style="flex-wrap:nowrap"><input class="inp otp" id="otp-firma" maxlength="6" inputmode="numeric" style="max-width:200px"><button class="btn btn-primary" data-a="p-otpf-ver">Verificar</button></div><div id="otpf-err"></div>` : `<button class="btn" data-a="p-otpf-env" data-cel="${esc(fa.celular)}" style="align-self:flex-start">Enviar código</button>`}</div>
   <div id="firma-check"></div><button class="btn btn-lg btn-primary btn-block" data-a="p-firmar-ad" id="btn-firmar">${ICON.pen} Firmar</button></div>`);
  P.pad = montarFirma($('#sig', root)); $('#sig', root).addEventListener('firma-cambio', () => { const ph = $('.sig-ph', root); if (ph) ph.hidden = !P.pad.vacia(); });
  (async () => { const fo = await Store.getFile(req.id + '__firmado'); if (fo && fo.original) renderPdf($('#p-pdf', root), dataUrlToBytes(fo.original).buffer); else $('#p-pdf', root).innerHTML = '<div class="note">El documento firmado no está disponible en este dispositivo.</div>'; })();
}
async function pFirmarAdicional() {
  const {req, firma: fa} = preq(); const box = $('#firma-check', P.root); const faltan = [];
  if (!$('#fa-acepto', P.root).checked) faltan.push('aceptar el contenido'); if (soloDig($('#fa-idc', P.root).value) !== fa.idNum) faltan.push('confirmar tu identificación correctamente');
  if (!P.pad || P.pad.vacia()) faltan.push('firmar'); if (!P.otpFirma || !P.otpFirma.verificadoAt) faltan.push('verificar el código');
  if (faltan.length) { box.innerHTML = `<div class="note note-crit small">Falta: ${esc(faltan.join('; '))}.</div>`; return; }
  $('#btn-firmar', P.root).disabled = true;
  fa.estado = 'Firmada'; fa.firmadoAt = nowISO(); fa.evidenciaId = `EV-${hoyCO().slice(0, 4)}-${genToken(8).toUpperCase()}`; fa.imagen = P.pad.png(); fa.otp = Object.assign({}, P.otpFirma, {codigo: undefined}); fa.hashDocumento = req.firma.hashFirmado; fa.ua = navigator.userAgent;
  req.firma.adicionales = req.firmasAdicionales.filter(a => a.estado === 'Firmada').map(a => ({nombre: a.nombre, id: a.idNum, calidad: a.calidad, firmadoAt: a.firmadoAt, evidenciaId: a.evidenciaId}));
  const bytes = pdfKyc(req, {fecha: req.documento?.generadoAt, firma: req.firma}); req.firma.hashFirmado = await sha256Hex(bytes.slice(0));
  await Store.putFile(req.id + '__firmado', {original: bytesToDataUrl(bytes, 'application/pdf'), mime: 'application/pdf', nombre: `KYC_${req.id}_firmado.pdf`});
  ev(req, 'tercero', 'Firma adicional registrada', `${fa.nombre} · ${fa.calidad} · ${fa.evidenciaId}`); P.otpFirma = null; await Store.save(req); renderPortal();
}
</script>

<script>
/* =====================================================================
   Case Manager, integraciones, documentación, eventos y arranque
   ===================================================================== */
function diasAlerta(r) { return Math.max(0, Math.floor((Date.now() - new Date(r.caseManager.transferidoAt)) / 86400000)); }
const CM_TABS = [['gestion', 'En Gestión'], ['asignacion', 'Pendientes de asignación'], ['pendiente', 'Pendientes de gestión'], ['cerrados', 'Cerrados'], ['todos', 'Todos']];
function cmGrupo(r) { if (r.revision && ['Aprobado', 'Rechazado'].includes(r.revision.decision)) return 'cerrados'; const pend = (r.caseManager.tareas || []).filter(t => !t.hecha).length; if (!r.responsable) return 'asignacion'; return pend ? 'gestion' : 'pendiente'; }
function vistaCM() {
  const todos = Store.all().filter(r => r.caseManager); const F = S.cmF || (S.cmF = {q: '', riesgo: '', tab: 'todos'});
  const casos = todos.filter(r => (F.tab === 'todos' || cmGrupo(r) === F.tab) && (!F.riesgo || r.validacion?.riesgo?.nivel === F.riesgo) && (!F.q || normTxt(r.caseManager.caseId + ' ' + nombreTercero(r) + ' ' + idTercero(r)).includes(normTxt(F.q))));
  let sel = Store.get(S.cmSel); if (!sel || !sel.caseManager) sel = casos[0];
  const head = `<div class="topbar"><div class="stack-sm"><span class="eyebrow">Case Manager · destino ${esc(APP.cm.baseUrl.replace('https://', ''))} ${simTag}</span><h1>Filtros de Búsqueda, para el caso</h1></div><div class="row"><span class="small muted">Casos creados automáticamente al terminar el diligenciamiento</span></div></div>
  <div class="panel"><div class="panel-body stack"><div class="cm-filters">
   <div class="field"><label for="cm-q">Número de caso o tercero</label><input class="inp" id="cm-q" data-cmf="q" value="${esc(F.q)}" placeholder="CM-2026-… o nombre"></div>
   <div class="field"><label for="cm-r">Nivel de riesgo</label><select class="inp" id="cm-r" data-cmf="riesgo"><option value="">Todos</option>${['Alto', 'Medio', 'Bajo'].map(x => `<option ${F.riesgo === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>Origen</label><input class="inp" value="Onboarding digital KYC" disabled></div>
   <div class="field"><label>Tipología</label><input class="inp" value="Vinculación de tercero" disabled></div></div>
   <div class="row"><button class="btn btn-primary" data-a="cm-buscar">Buscar Casos</button><button class="btn" data-a="cm-limpiar">Limpiar</button></div></div></div>
  <div class="cm-status">${CM_TABS.map(([k, t]) => `<button class="${F.tab === k ? 'on' : ''}" data-a="cm-tab" data-k="${k}">${t}<b>${k === 'todos' ? todos.length : todos.filter(r => cmGrupo(r) === k).length}</b></button>`).join('')}</div>`;
  if (!todos.length) return `<div class="cmx stack">${head}<div class="panel empty"><h3>Aún no hay casos</h3><p>Cuando un tercero termina el diligenciamiento y firma, el caso se crea aquí y luego se ejecuta la búsqueda en Search.</p><button class="btn" data-a="nav" data-v="tablero">Ir a solicitudes</button></div></div>`;
  const lista = `<div class="panel"><div class="panel-head"><span class="lista-lbl">Lista de casos</span><span class="small muted">${casos.length} caso(s)</span></div>
   <div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl grid-tbl"><thead><tr><th style="width:34px"><input type="checkbox" aria-label="Seleccionar todos" disabled></th><th>N.º caso</th><th>Tercero</th><th>Identificación</th><th>Riesgo</th><th>Search</th><th>Estado</th><th>Asignado a</th><th class="num">Días alerta</th></tr></thead><tbody>
   ${casos.map(r => { const d = diasAlerta(r); const sr = r.search; return `<tr class="clickable ${sel && r.id === sel.id ? 'on' : ''}" data-a="cm-sel" data-id="${r.id}"><td><input type="checkbox" aria-label="Seleccionar ${esc(r.caseManager.caseId)}" ${sel && r.id === sel.id ? 'checked' : ''}></td><td class="mono">${esc(r.caseManager.caseId)}</td><td style="font-weight:700">${esc(nombreTercero(r))}</td><td class="mono">${esc(idTercero(r))}</td><td>${riesgoPill(r.validacion)}</td><td>${sr ? `<span class="pill ${sr.total ? 'p-crit' : 'p-ok'}">${sr.total} coinc.</span>` : '<span class="pill p-neutral">Pendiente</span>'}</td><td><span class="small">${esc(CM_TABS.find(t => t[0] === cmGrupo(r))[1])}</span></td><td class="small">${esc((r.responsable || '').split(' · ')[0])}</td><td class="num"><span class="dias ${d < 3 ? 'ok' : d < 8 ? 'mid' : ''}">${d}</span></td></tr>`; }).join('') || '<tr><td colspan="9" class="muted small" style="text-align:center;padding:20px">Ningún caso coincide con los filtros.</td></tr>'}
   </tbody></table></div><div class="cm-pag"><span>${casos.length ? 1 : 0} a ${casos.length} de ${casos.length}</span><span>Página 1 de 1</span></div></div>`;
  if (!sel) return `<div class="cmx stack">${head}${lista}</div>`;
  const cm = sel.caseManager; const pend = cm.tareas.filter(t => !t.hecha).length; const v = sel.validacion; const sr = sel.search;
  const prioC = p => p === 'Crítica' ? 'p-crit' : p === 'Alta' ? 'p-warn' : p === 'Media' ? 'p-info' : 'p-neutral';
  return `<div class="cmx stack">${head}${lista}
   <div class="panel"><div class="panel-body stack" style="min-width:0">
   <div class="row-between"><div class="stack-sm" style="gap:2px;min-width:0"><span class="mono small muted">${esc(cm.caseId)} · origen ${esc(sel.id)}</span><h2>${esc(nombreTercero(sel))}</h2><span class="small muted">${sel.tipoPersona === 'juridica' ? 'Persona jurídica' : 'Persona natural'} · ${esc(idTercero(sel))} · ${esc(sel.tipoVinculacion)} · Asignado a ${esc(sel.responsable)}</span></div><div class="row">${riesgoPill(v)}<span class="pill p-violet">${esc(cm.estado)}</span>${sel.revision ? pill(sel.revision.decision) : ''}</div></div>

    <div class="panel"><div class="panel-head"><h3>Adjuntos recibidos</h3></div><div class="panel-body stack-sm">${(sel.documentos || []).map(d => `<div class="row-between small"><span>${ICON.doc} ${esc(d.nombre)}</span><span class="mono tiny muted">${esc(d.sha256.slice(0, 12))}…</span></div>`).join('')}<div class="row-between small"><span>${ICON.doc} KYC_${esc(sel.id)}_firmado.pdf</span><button class="btn btn-sm" data-a="ver-firmado-modal" data-id="${sel.id}">Ver</button></div>${sr ? `<div class="row-between small"><span>${ICON.search} Resultado Search ${esc(sr.consultaId)}</span><button class="btn btn-sm" data-a="nav" data-v="search">Ver</button></div>` : ''}<div class="sep"></div><span class="small"><b>Evidencia de firma</b> ${esc(sel.firma?.evidenciaId || '')} · ${esc(sel.firma?.firmante?.nombre || '')} · ${fmtFH(sel.firma?.firmadoAt)}</span></div></div>
   </div>

   ${sel.tipoPersona === 'juridica' ? `<div class="panel"><div class="panel-head"><h3>Estructura de propiedad</h3></div><div class="panel-body"><div class="tree-wrap">${arbolSVG(sel)}</div></div></div>` : ''}

   <details class="panel"><summary class="panel-head" style="cursor:pointer"><h3>Expediente estructurado (JSON)</h3><span class="small muted">${bytesTxt(cm.payloadBytes || 0)}</span></summary><div class="panel-body stack-sm"><div class="row"><button class="btn btn-sm" data-a="expediente" data-id="${sel.id}">${ICON.dl} Descargar</button><button class="btn btn-sm" data-a="copiar" data-sel="#cm-json">Copiar</button></div><pre class="code" id="cm-json">${esc(JSON.stringify(expedienteJSON(sel), null, 2))}</pre></div></details>

  <div class="panel"><div class="panel-head"><h3>Resultados · ${esc(sel.search.consultaId)}</h3><div class="row"><button class="btn btn-sm" data-a="cm-abrir" data-id="${sel.id}">${ICON.case} Ver caso ${esc(sel.search.caseId)}</button></div></div>${searchResHTML(sel.search)}</div>`;

function docArquitectura() {
  return `<div class="doc-sec"><h2>Arquitectura técnica del módulo de Onboarding Digital</h2>
  <p>El módulo se diseña como un servicio API-first y multiempresa dentro de STRADATA AML Cloud Suite. El prototipo implementa en el navegador la misma separación de responsabilidades que tendrá la versión productiva, de modo que cada pieza simulada se reemplace por su servicio real sin rediseñar el flujo.</p>
  <div class="diagram"><div class="stack" style="min-width:760px">
   ${capa('Canales', box('Portal del tercero', 'SPA móvil por enlace único, sin cuenta', 'a') + box('Consola del analista', 'SSO de AML Cloud Suite, RBAC') + box('Notificaciones', 'Correo · WhatsApp · SMS/OTP'), 3)}
   ${capa('Borde', box('API Gateway + WAF', 'Rate limiting, OAuth 2.0/OIDC para analistas, token de enlace + OTP para terceros', 'd'), 1)}
   ${capa('Servicios del módulo', box('Solicitudes y enlaces', 'Estados, vigencia, revocación') + box('Formularios dinámicos', 'Esquemas JSON por entidad y tipo') + box('Inteligencia documental', 'Clasificación, OCR, extracción, confianza') + box('Motor de reglas', 'Cruces, completitud, estructura, riesgo') + box('Conectores externos', 'RUES, DIAN, identidad, listas/PEP') + box('Generación documental', 'PDF/A con plantillas') + box('Adaptador de firma', 'Electrónica y digital por proveedor') + box('Expediente y evidencias', 'Paquete inmutable con hashes') + box('Integración Case Manager', 'REST + eventos, idempotente') + box('Auditoría', 'Bitácora de eventos inmutable'), 5)}
   ${capa('Datos', box('PostgreSQL', 'Solicitudes, formularios, eventos', 'd') + box('Almacenamiento de objetos', 'Documentos y PDFs cifrados (KMS)', 'd') + box('Bus de eventos', 'solicitud.*, expediente.*', 'd') + box('Bóveda de secretos', 'Credenciales de proveedores', 'd'), 4)}
  </div></div>
  <h3>Recorrido de una vinculación</h3><ol>
   <li>El analista crea la solicitud: se persiste con estado “Pendiente de envío” y se genera un token aleatorio asociado al identificador interno y a la fecha límite.</li>
   <li>El servicio de notificaciones envía la invitación (correo transaccional o plantilla de WhatsApp Business) y registra los estados de entrega.</li>
   <li>El tercero abre el enlace; el gateway valida token, vigencia y, si aplica, OTP. Cada acceso queda en la bitácora.</li>
   <li>Cada documento se clasifica y se extrae; los datos precargan el formulario con su origen y confianza. Las correcciones del tercero quedan trazadas contra el valor extraído.</li>
   <li>El motor de reglas cruza documentos, formulario y registro del analista; el tercero ve los controles de consistencia, no las consultas de listas.</li>
   <li>Se genera el PDF, se calcula su huella y el tercero firma (aceptación, trazo, OTP). El adaptador de firma produce el documento firmado y el certificado de evidencias.</li>
   <li>Con la firma se ejecutan las consultas externas y la matriz de riesgo; el expediente queda “Completado” y el analista lo revisa.</li>
   <li>Documentos exigidos · persona natural: cédula, certificación bancaria y RUT si lo tiene · persona jurídica: Cámara de Comercio, RUT actualizado (≤ 30 días, se rechaza si es más antiguo), certificación bancaria, cédula del representante legal y certificado de participación accionaria. La certificación bancaria a nombre de otro titular se rechaza; si un documento no se puede leer automáticamente se acepta y queda pendiente de verificación manual (V25).</li>
   <li>Al terminar el diligenciamiento se crea el caso en Case Manager (JSON + adjuntos + evidencias); las alertas se convierten en tareas de gestión.</li>
   <li>Con el caso creado se ejecuta la búsqueda en Search (Buscador Unificado) para todos los terceros del expediente; el resultado y su identificador de consulta se adjuntan al caso y generan las tareas de revisión de coincidencias.</li></ol>
  <h3>Seguridad y protección de datos</h3><ul>
   <li>Concordancia documental en la carga: se rechaza el documento cuyo tipo no es el solicitado (R1), cuyo número o NIT es ilegible (R2) o que pertenece a otra persona o empresa frente a los documentos ya cargados o al registro de la solicitud (R3). Cada rechazo queda en la bitácora y como señal para el analista.</li>
   <li>Token de enlace con ~162 bits de entropía; en producción se almacena solo su hash, con expiración y un único token vigente por solicitud.</li>
   <li>Tras la firma el enlace queda en solo lectura; una corrección emite un enlace nuevo y revoca el anterior (restricción de reutilización).</li>
   <li>OTP con hash, TTL de 5 minutos y límite de intentos; registro de sesión, dispositivo y agente de usuario.</li>
   <li>Cifrado TLS 1.2+ en tránsito y AES-256 en reposo; análisis antimalware de archivos; URLs de descarga prefirmadas y con expiración.</li>
   <li>Ley 1581 de 2012: aviso de privacidad, autorización expresa con fecha y hora, finalidades limitadas, minimización y políticas de retención por entidad.</li>
   <li>Separación por entidad (tenant) en datos, llaves de cifrado y configuración.</li></ul>
  <h3>Firma electrónica y firma digital</h3>
  <p><b>Firma electrónica</b> (Ley 527 de 1999, Decreto 2364 de 2012): cualquier mecanismo confiable que identifique al firmante y su aprobación del contenido. El prototipo combina identificación declarada, aceptación expresa, trazo manuscrito, OTP y huella SHA-256, con certificado de evidencias anexo al PDF.</p>
  <p><b>Firma digital</b>: firma basada en un certificado emitido por una Entidad de Certificación Digital acreditada por ONAC, con presunción de autenticidad. Requiere proveedor; el adaptador de firma del módulo la soporta como segundo nivel cuando la entidad lo exija.</p>
  <h3>Cómo se vuelve reutilizable en AML Cloud Suite</h3><ul>
   <li>Configuración por entidad: marca, textos legales, canales, vigencia, OTP y proveedor de firma.</li>
   <li>Formularios como esquemas JSON por tipo de persona y tipo de vinculación (cliente, proveedor, empleado), con documentos requeridos y mapeo OCR → campo.</li>
   <li>Reglas y matriz de riesgo parametrizables por segmento; versionadas para auditoría.</li>
   <li>Conectores con interfaz común (consulta → respuesta normalizada con origen y fecha), intercambiables sin tocar el flujo.</li>
   <li>Eventos publicados (solicitud.creada, solicitud.estado_cambiado, expediente.firmado, expediente.transferido) para integrarse con Case Manager y con los sistemas de la entidad.</li></ul></div>`;
}

  if (d.pf && t.tagName !== 'SELECT') pCampo(d.pf, t.value, false);
  if (d.filtro === 'q') { S.filtro.q = t.value; clearTimeout(S.qT); S.qT = setTimeout(() => { const sel = [t.selectionStart, t.selectionEnd]; render(); const n = $('#f-q'); if (n) { n.focus(); try { n.setSelectionRange(sel[0], sel[1]); } catch (x) {} } }, 250); }
  if (d.fir) { P.firmante = P.firmante || {}; P.firmante[d.fir] = t.value; }
  if (d.pepd) { const [q, k] = d.pepd.split(':'); const {req} = preq(); req.pep.det[q] = Object.assign({}, req.pep.det[q], {[k]: t.value}); pGuardar(req); }
  if (d.acc && t.type !== 'checkbox' && t.tagName !== 'SELECT') { const [id, k] = d.acc.split(':'); const {req} = preq(); const a = req.accionistas.find(x => x.id === id); if (a) { a[k] = k === 'pct' ? (t.value.replace(',', '.') === '' ? '' : +t.value.replace(',', '.')) : t.value; pGuardar(req); } }
});
document.addEventListener('change', e => {
  const t = e.target; const d = t.dataset || {};
  if (d.filtro && d.filtro !== 'q') { S.filtro[d.filtro] = t.value; render(); }
  if (d.nueva) S.nueva[d.nueva] = t.type === 'checkbox' ? t.checked : t.value;
  if (d.pf) pCampo(d.pf, t.value, true);
  if (d.upload && t.files && t.files[0]) pProcesar(d.upload, t.files[0]);
  if (d.confirmar) { const {req} = preq(); const s = req.fuentes[d.confirmar]; if (s) { s.confirmado = t.checked; if (t.checked) ev(req, 'tercero', 'Dato de baja confianza confirmado', (esquema(req).find(x => x.k === d.confirmar) || {}).l || d.confirmar); pGuardar(req, true); } }
  if (d.decl) { const {req} = preq(); req.declaraciones[d.decl] = t.checked ? nowISO() : null; pGuardar(req); }
  if (d.fir) { P.firmante = P.firmante || {}; P.firmante[d.fir] = t.value; }
  if (d.acc) { const [id, k] = d.acc.split(':'); const {req} = preq(); const a = req.accionistas.find(x => x.id === id); if (a) { a[k] = t.type === 'checkbox' ? t.checked : k === 'pct' ? (+String(t.value).replace(',', '.') || 0) : t.value; pGuardar(req, true); renderPortal(); } }
  if (d.tarea) { const [id, tid] = d.tarea.split(':'); const r = Store.get(id); const tk = r.caseManager.tareas.find(x => x.id === tid); tk.hecha = t.checked; tk.at = nowISO(); ev(r, 'case_manager', t.checked ? 'Tarea completada' : 'Tarea reabierta', tk.t); Store.save(r); }
});
window.addEventListener('hashchange', () => { if ($('#modal-root').innerHTML) closeModal(); const H = leerHash(); if (!H.portal && !H.firma) { if (P.root && $('#app').contains(P.root)) P.root = null; $('#app').innerHTML = ''; } render(); });

/* ---------- Arranque ---------- */
Store.init();
Store.on(src => {
  const H = leerHash();
  if (H.portal || H.firma) { portalOnStore(); return; }
  if (src !== 'portal' || true) renderSeguro();
  if (S.sim) portalOnStore();
});
render();
async function iniciarRemoto() { // dominio publicado con servidor: datos compartidos entre dispositivos
  const est = await Remoto.estado(); if (!est) return false;
  APP.remoto = {panelConfigurado: est.panelConfigurado, login: null, error: ''};
  const H = leerHash();
  if (H.portal || H.firma) { Remoto.modo = H.firma ? 'firma' : 'portal'; Remoto.token = H.portal || H.firma; Store.reqs.clear(); Store.attachDb(Remoto.db(), 'servidor'); return true; }
  Remoto.modo = 'panel'; Store.reqs.clear(); Store.files.clear();
  if (!est.panelConfigurado) { APP.remoto.login = 'config'; Store.markReady(); render(); return true; }
  Remoto.clave = leerClave();
  if (!Remoto.clave || !(await Remoto.probar())) { if (Remoto.clave) borrarClave(); Remoto.clave = null; APP.remoto.login = 'clave'; Store.markReady(); render(); return true; }
  Store.attachDb(Remoto.db(), 'servidor'); render(); return true;
}
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form="login"]'); if (!f) return; e.preventDefault();
  const c = ($('#clave-in') || {}).value || ''; if (!c) return; Remoto.clave = c; const b = f.querySelector('button[type="submit"]'); if (b) { b.disabled = true; b.textContent = 'Verificando…'; }
  if (await Remoto.probar()) { guardarClave(c, ($('#clave-rec') || {}).checked); APP.remoto.login = null; APP.remoto.error = ''; Store.attachDb(Remoto.db(), 'servidor'); render(); }
  else { Remoto.clave = null; APP.remoto.error = 'Clave incorrecta.'; render(); }
});
(async () => {
  if (enlaceServido() && await iniciarRemoto()) return;
  const db = await claudeUse('db');
  if (db) {
    Store.attachDb(db);
    const user = await claudeUse('user'); if (user && user.can) { try { const c = await user.can('data.write'); Store.canWrite = c; if (c === false) toast('Tu acceso a este prototipo es de solo lectura: los cambios no se compartirán.', true); } catch (e) {} }
  } else {
    if (!Store.reqs.size) { crearHistoricos().forEach(r => Store.reqs.set(r.id, r)); Store.saveLocal(); }
    Store.markReady();
  }
  Store.emit('ready');
})();
</script>
